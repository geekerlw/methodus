# Methodus user config
default_runtime: claude-code
permission_mode: acceptEdits

# Per-task executor working directory (Claude/Codex/Cursor cwd).
# Default if unset: <METHODUS_HOME>/workspaces
# Absolute, ~/..., or relative to this home directory.
# OS notifications when away from the pane (approval / error / inbox / your turn).
# In the TUI, status bar + composer always show pending work. Set METHODUS_NOTIFY=always
# to force OS banners even when the pane looks active.
# notifications: true
#
# Polish rule-based note/patch drafts with one short executor call (plan mode, no tools).
