[package]
name = "methodus-desktop"
version = "0.1.0"
description = "Methodus continuous-learning desktop workbench"
authors = ["Steven Lee"]
edition = "2021"
license = "MIT"
rust-version = "1.75"

[lib]
name = "methodus_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
portable-pty = "0.9"
tauri-plugin-notification = "2"
methodus-core = { path = "../../../crates/methodus-core" }
methodus-domain = { path = "../../../crates/methodus-domain" }
methodus-runtime = { path = "../../../crates/methodus-runtime" }
methodus-store = { path = "../../../crates/methodus-store" }

[workspace]
