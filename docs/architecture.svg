<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Methodus architecture</title>
  <desc id="desc">Methodus is a maintainer knowledge studio with a focused Learn runtime and a read-only CLI connector for native coding agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="studio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset="1" stop-color="#243b53"/>
    </linearGradient>
    <linearGradient id="memory" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#172554"/>
      <stop offset="1" stop-color="#1e3a5f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity="0.28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#93c5fd"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#86efac"/>
    </marker>
    <style>
      .title { font: 700 30px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #bfdbfe; }
      .group-title { font: 700 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #dbeafe; letter-spacing: 1px; }
      .node-title { font: 700 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #f8fafc; }
      .node-copy { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #cbd5e1; }
      .label { font: 600 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #bfdbfe; }
      .legend { font: 400 11px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #94a3b8; }
    </style>
  </defs>

  <rect width="1200" height="760" rx="22" fill="url(#bg)"/>
  <text x="52" y="54" class="title">Methodus architecture</text>
  <text x="52" y="82" class="subtitle">Maintainer-curated engineering memory for native agent runtimes</text>

  <!-- Actors -->
  <g filter="url(#shadow)">
    <rect x="52" y="144" width="220" height="108" rx="16" fill="#0b1220" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="76" y="180" class="node-title">Maintainer</text>
    <text x="76" y="205" class="node-copy">Learn, review, curate</text>
    <text x="76" y="224" class="node-copy">and publish engineering memory</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="52" y="496" width="220" height="108" rx="16" fill="#0b1220" stroke="#86efac" stroke-width="1.5"/>
    <text x="76" y="532" class="node-title">Developer</text>
    <text x="76" y="557" class="node-copy">Works in a native</text>
    <text x="76" y="576" class="node-copy">Claude / Codex / Cursor session</text>
  </g>

  <!-- Maintainer studio -->
  <g filter="url(#shadow)">
    <rect x="326" y="116" width="456" height="306" rx="20" fill="url(#studio)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="352" y="146" class="group-title">METHODUS TUI · SINGLE FOCUSED LEARN</text>

    <rect x="352" y="168" width="190" height="94" rx="12" fill="#1d4ed8" fill-opacity="0.32" stroke="#60a5fa"/>
    <text x="372" y="200" class="node-title">Learn conversation</text>
    <text x="372" y="222" class="node-copy">Runtime-backed research</text>
    <text x="372" y="240" class="node-copy">with durable events</text>

    <rect x="566" y="168" width="190" height="94" rx="12" fill="#1d4ed8" fill-opacity="0.20" stroke="#60a5fa"/>
    <text x="586" y="200" class="node-title">Review &amp; graph</text>
    <text x="586" y="222" class="node-copy">Approve, reject, merge</text>
    <text x="586" y="240" class="node-copy">and inspect relations</text>

    <rect x="352" y="286" width="190" height="94" rx="12" fill="#1d4ed8" fill-opacity="0.20" stroke="#60a5fa"/>
    <text x="372" y="318" class="node-title">Team &amp; health</text>
    <text x="372" y="340" class="node-copy">Validate roots, diff,</text>
    <text x="372" y="358" class="node-copy">and write publish plans</text>

    <rect x="566" y="286" width="190" height="94" rx="12" fill="#1d4ed8" fill-opacity="0.20" stroke="#60a5fa"/>
    <text x="586" y="318" class="node-title">Runtime controls</text>
    <text x="586" y="340" class="node-copy">Claude, Codex, Cursor</text>
    <text x="586" y="358" class="node-copy">permissions and resume</text>
  </g>

  <!-- Learning runtimes -->
  <g filter="url(#shadow)">
    <rect x="846" y="116" width="302" height="306" rx="20" fill="#172033" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="872" y="146" class="group-title">LEARNING RUNTIME ADAPTERS</text>
    <rect x="872" y="168" width="250" height="64" rx="12" fill="#422006" fill-opacity="0.65" stroke="#fbbf24"/>
    <text x="896" y="196" class="node-title">Claude Code</text>
    <text x="896" y="216" class="node-copy">Focused Learn session only</text>
    <rect x="872" y="248" width="250" height="64" rx="12" fill="#422006" fill-opacity="0.65" stroke="#fbbf24"/>
    <text x="896" y="276" class="node-title">Codex</text>
    <text x="896" y="296" class="node-copy">Focused Learn session only</text>
    <rect x="872" y="328" width="250" height="64" rx="12" fill="#422006" fill-opacity="0.65" stroke="#fbbf24"/>
    <text x="896" y="356" class="node-title">Cursor Agent</text>
    <text x="896" y="376" class="node-copy">Focused Learn session only</text>
  </g>

  <!-- Canonical memory -->
  <g filter="url(#shadow)">
    <rect x="326" y="482" width="456" height="176" rx="20" fill="url(#memory)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="352" y="512" class="group-title">CANONICAL MEMORY · MARKDOWN FIRST</text>
    <rect x="352" y="532" width="128" height="86" rx="11" fill="#312e81" stroke="#a78bfa"/>
    <text x="370" y="563" class="node-title">Personal</text>
    <text x="370" y="585" class="node-copy">Drafts and</text>
    <text x="370" y="601" class="node-copy">committed notes</text>
    <rect x="498" y="532" width="128" height="86" rx="11" fill="#312e81" stroke="#a78bfa"/>
    <text x="516" y="563" class="node-title">Team</text>
    <text x="516" y="585" class="node-copy">Git-backed shared</text>
    <text x="516" y="601" class="node-copy">knowledge roots</text>
    <rect x="644" y="532" width="112" height="86" rx="11" fill="#312e81" stroke="#a78bfa"/>
    <text x="662" y="563" class="node-title">Runs</text>
    <text x="662" y="585" class="node-copy">Events, sources</text>
    <text x="662" y="601" class="node-copy">and candidates</text>
  </g>

  <!-- Agent read path -->
  <g filter="url(#shadow)">
    <rect x="846" y="482" width="302" height="176" rx="20" fill="#052e16" stroke="#86efac" stroke-width="1.5"/>
    <text x="872" y="512" class="group-title">READ-ONLY AGENT CONNECTOR</text>
    <rect x="872" y="532" width="250" height="46" rx="11" fill="#14532d" stroke="#86efac"/>
    <text x="896" y="561" class="node-title">Official connector Skill</text>
    <rect x="872" y="592" width="250" height="46" rx="11" fill="#14532d" stroke="#86efac"/>
    <text x="896" y="621" class="node-title">methodus agent CLI</text>
  </g>

  <!-- Flow arrows -->
  <path d="M272 198 C294 198 302 198 326 198" fill="none" stroke="#93c5fd" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="278" y="185" class="label">maintain</text>

  <path d="M542 188 C628 132 756 132 846 188" fill="none" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="674" y="108" class="label">learn turn</text>

  <path d="M456 422 L456 482" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="470" y="456" class="label">reviewed writes</text>

  <path d="M672 422 L672 482" fill="none" stroke="#a78bfa" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="686" y="456" class="label">index / audit</text>

  <path d="M272 550 L300 550 L300 452 L810 452 L810 550 L846 550" fill="none" stroke="#86efac" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="514" y="445" class="label">read-only context</text>

  <path d="M997 422 L997 482" fill="none" stroke="#86efac" stroke-width="2.5" marker-end="url(#arrow-green)"/>
  <text x="1012" y="456" class="label">native agent query</text>

  <!-- Boundary notes -->
  <path d="M326 694 L782 694" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="5 5"/>
  <text x="326" y="721" class="legend">TUI writes · CLI reads · native coding sessions stay in the runtime</text>
  <circle cx="850" cy="718" r="5" fill="#fbbf24"/>
  <text x="864" y="722" class="legend">managed Learn runtime</text>
  <circle cx="1002" cy="718" r="5" fill="#86efac"/>
  <text x="1016" y="722" class="legend">consumer read path</text>
</svg>
